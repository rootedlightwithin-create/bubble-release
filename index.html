<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bubble Release</title>

<link rel="manifest" href="manifest.json">

<style>
  body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at bottom, #aeefff, #ffffff);
  }

  .bubble {
    position: absolute;
    border-radius: 50%;
    cursor: pointer;
    transition: transform 0.15s ease-out, opacity 0.2s;
  }

  .pop {
    transform: scale(1.5);
    opacity: 0;
  }
</style>
</head>
<body>

<script>
// 🌈 Colour shifts based on interaction
let energy = 0;

// Load pop sound (optional)
let popSound;
try {
  popSound = new Audio('pop.mp3');
} catch(e) {
  console.log("No pop sound available");
}

// Returns bubble color based on energy
function getColour() {
  const hue = (200 - energy + 360) % 360;
  return `hsla(${hue}, 80%, 70%, 0.7)`;
}

// Create a bubble with smooth animation
function createBubble() {
  const bubble = document.createElement("div");

  // Bigger size: 40px → 120px
  const size = Math.random() * 80 + 40;
  bubble.classList.add("bubble");
  bubble.style.width = size + "px";
  bubble.style.height = size + "px";
  bubble.style.background = getColour();

  // Random horizontal start
  const startX = Math.random() * (window.innerWidth - size);
  bubble.style.left = startX + "px";
  bubble.style.top = window.innerHeight + "px";

  document.body.appendChild(bubble);

  // Animation variables
  let posY = window.innerHeight;
  const speed = Math.random() * 2 + 1;          // Vertical speed
  const rotation = Math.random() * 2 - 1;       // Rotation per frame

  // Drift side-to-side like floating bubble
  const driftAmplitude = Math.random() * 20 + 10;   // Max horizontal oscillation
  const driftFrequency = Math.random() * 0.05 + 0.02; // Speed of oscillation
  const driftOffset = Math.random() * 2 * Math.PI;  // Phase shift

  const rise = setInterval(() => {
    posY -= speed;
    bubble.style.top = posY + "px";

    // Smooth side-to-side drift
    const offsetX = driftAmplitude * Math.sin(driftFrequency * posY + driftOffset);
    bubble.style.left = startX + offsetX + "px";

    // Rotation
    const currentRotation = bubble._rotation || 0;
    bubble._rotation = currentRotation + rotation;
    bubble.style.transform = `rotate(${bubble._rotation}deg)`;

    // Fade out as it rises
    bubble.style.opacity = Math.max(0, (window.innerHeight - posY) / window.innerHeight);

    if (posY < -100) {
      bubble.remove();
      clearInterval(rise);
    }
  }, 20);

  // Pop bubble on click
  bubble.addEventListener("click", () => {
    bubble.classList.add("pop");
    if (popSound) {
      popSound.currentTime = 0;
      popSound.play();
    }
    energy = Math.min(300, energy + 15);
    setTimeout(() => {
      bubble.remove();
      clearInterval(rise);
    }, 200);
  });
}

// Energy slowly settles back down (calming effect)
setInterval(() => {
  energy = Math.max(0, energy - 0.5);
}, 100);

// Continuously create bubbles
setInterval(createBubble, 500);

// Some bubbles on load
for (let i = 0; i < 10; i++) createBubble();

// Register service worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
